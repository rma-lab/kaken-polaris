# KAKEN Polaris ルーブリック v0（叩き台）
# 対象: 基盤研究(B)(C)・若手研究 研究計画調書（添付ファイル項目）
# 一次資料: 審査規程 別添5・6（評定基準）、様式 s-13/s-14/s-21 の指示書き、記入要領
#           → reference/yoshiki/2027/form_structure.md
#
# 構造:
#   observation（観点）1件 = 審査委員が「不十分」を選ぶ単位（規程の問い）を、様式の小項目に落としたもの
#   levels: 4/3/2/1 は「観察できる状態」で書く。「優れている」等の抽象語は使わない
#   evidence: LLM に引用させる箇所（判定の根拠を本文から必ず引かせる）
#   directions: 修正の方向（修正文は書かない。第5節のレポート内容方針）
#   questions: 研究者本人にしか答えられない問いかけ
#   transcript_check: 面談テキストがある場合の突合ポイント
#   applies_to: 種目差分
#   cards: この観点にぶら下がる知見カードの id（今後追加）

version: 0.1
updated: 2026-09-23
categories: [kiban_b, kiban_c, wakate]

evaluation_elements:
  A1: {name: 研究課題の学術的重要性, affects: 総合評点（採否）}
  A2: {name: 研究方法の妥当性, affects: 総合評点（採否）}
  A3: {name: 研究遂行能力及び研究環境の適切性, affects: 総合評点（採否）}
  B:  {name: 研究課題の国際性, affects: 配分額・国際若手支援強化枠（採否には直接効かない）, applies_to: [kiban_b, kiban_c]}

observations:

  # ---------------------------------------------------------------- 欄1 概要
  - id: R01
    name: 概要が全体像を10行で伝えている
    element: A1
    section: 欄1 概要
    source: 記入要領「概要については10行程度」/ 様式「冒頭にその概要を簡潔にまとめて記述」
    levels:
      4: 問い・目的・方法・到達点・意義の5要素が概要内に揃い、概要だけ読めば審査委員が課題の骨格を説明できる
      3: 5要素のうち4つがあるが、1つ（多くは到達点か意義）が欠けている
      2: 背景説明や動機が大半を占め、方法か到達点が概要に含まれない
      1: 概要がない、または本文の冒頭段落を切り出しただけで要約になっていない
    evidence: 概要部分の全文と、5要素それぞれに該当する文
    directions:
      - 欠けている要素を一文ずつ足し、背景の記述を削って行数内に収める
      - 概要の順序を「問い→目的→方法→到達点→意義」に揃える
    questions:
      - この研究が終わったとき、何が「分かった」と言えるようになるか、一文で言えるか
    transcript_check: 面談で研究者が最初に語った「この研究の要点」と概要の内容が一致しているか

  # ---------------------------------------------------------------- 欄1 (1) 背景・経緯・問い
  - id: R02
    name: 学術的「問い」が明示されている
    element: A1
    section: 欄1 (1)
    source: 規程A(1)「研究課題の核心をなす学術的『問い』は明確であり」
    levels:
      4: 問いが疑問文または「〜か」で終わる一文として明示され、答え方（何をもって答えたとするか）が読み取れる
      3: 問いに相当する文はあるが、目的文（「〜を明らかにする」）の形で書かれ、問いとしての焦点がやや広い
      2: 目的や作業（「〜を開発する」「〜を調査する」）は書かれているが、問いの形になっていない
      1: 問いに相当する記述が見当たらない
    evidence: 問いに相当すると判断した文（複数候補があればすべて）
    directions:
      - 問いを一文に絞り、(1)の冒頭または見出し直下に置く
      - 「開発する」「構築する」型の目的は、その先にある「何が分かるか」に言い換える
      - Web入力項目「学術的『問い』（公開用）」と同じ文になっているか確認する
    questions:
      - この研究の問いに「はい/いいえ」または具体的な答えを返すとしたら、どんな答えになるか
    transcript_check: 面談で研究者が口頭で述べた問いと、申請書の問いが同じか。口頭の方が鋭ければそれを採用する
    applies_to: [kiban_b, kiban_c, wakate]

  - id: R03
    name: 着想に至った経緯が具体的
    element: A1
    section: 欄1 (1)
    source: 規程A(1)「研究計画の着想に至る経緯…は明確であるか」/ 様式(1)「本研究の着想に至った経緯」
    levels:
      4: 応募者自身の先行研究や観察から「なぜこの問いが生まれたか」が具体的な出来事・結果とともに書かれ、応募者がこの問いを立てる必然性が伝わる
      3: 経緯は書かれているが一般的な背景説明（分野の重要性）にとどまり、応募者固有の経緯が薄い
      2: 背景説明のみで、経緯（応募者がなぜこの問いに至ったか）の記述がない
      1: 背景も経緯も記述がない
    evidence: 経緯に相当する段落
    directions:
      - 応募者の過去の研究結果のうち、この問いを生んだ具体的な結果を一つ挙げて経緯にする
      - 分野一般の重要性は「研究動向と位置づけ」(3)に移す
    questions:
      - この問いを最初に思いついたきっかけは何か。どの結果、どの経験か
    transcript_check: 面談で語られた「きっかけ」のエピソードが申請書に入っているか
    note_wakate: 若手研究は「優れた着想」が種目の趣旨なので、この観点の重みを上げる

  # ---------------------------------------------------------------- 欄1 (2) 目的・独自性・創造性
  - id: R04
    name: 学術的独自性・創造性が既存研究との差で示されている
    element: A1
    section: 欄1 (2)
    source: 規程A(1)「学術的独自性や創造性が認められるか」/ 様式(2)「学術的独自性と創造性」
    levels:
      4: 「既存研究は〜まで、本研究は〜」の対比が具体的に書かれ、何が初めてか（対象・方法・視点のどれか）が特定できる
      3: 独自性の主張はあるが「初めて」「新しい」の根拠となる比較対象が明示されていない
      2: 独自性の記述が形容詞（新規性が高い、独創的）だけで、比較の中身がない
      1: 独自性に関する記述がない
    evidence: 独自性を主張している文と、比較対象として挙げられた先行研究
    directions:
      - 独自性を「対象」「方法」「視点」のどれで主張するかを決め、対応する先行研究との差を一つずつ書く
      - 形容詞による主張を、比較の事実に置き換える
    questions:
      - 最も近い先行研究は何か。それと本研究の違いを一文で言えるか
    transcript_check: 面談で「他と違うのはここ」と語った点が本文に反映されているか

  - id: R05
    name: 推進すべき重要な課題であることの説得
    element: A1
    section: 欄1 (1)(2)
    source: 規程A(1)「学術的に見て、推進すべき重要な研究課題であるか」
    levels:
      4: 問いに答えることで分野のどの未解決問題・論争・限界が動くかが書かれ、「今」取り組む理由（技術・データ・社会状況の変化など）が示されている
      3: 重要性は述べられているが、分野の中での位置（何が動くか）が抽象的
      2: 重要性が社会的意義（役に立つ）だけで語られ、学術的な重要性の説明がない
      1: 重要性の記述がない
    evidence: 重要性を主張している文
    directions:
      - 「この問いが解けると分野で何が変わるか」を一段落で書く
      - 社会的意義は波及効果(R06)に分け、ここでは学術的な重要性に絞る
      - 「今」取り組む理由を一文加える
    questions:
      - この問いが解けないままだと、分野の何が進まないか
      - なぜ10年前ではなく今この研究なのか
    transcript_check: 面談で語られた「この研究の学術的な意味」が本文の重要性の記述より強い場合、その差を指摘する
    note: 開示情報で＊が付きやすい項目の一つ（独自性が認められても「推進すべき重要性」が伝わらないケース）

  # ---------------------------------------------------------------- 欄1 (3) 研究動向と位置づけ
  - id: R06
    name: 国内外の研究動向が整理され、本研究の位置づけが明確
    element: A1
    section: 欄1 (3)
    source: 規程A(1)「関連する国内外の研究動向と研究の位置づけは明確であるか」
    levels:
      4: 国内・国外の主要な先行研究が引用付きで整理され、それらの到達点と限界が示された上で、本研究がどの限界に取り組むかが図または一段落で示されている
      3: 先行研究の整理はあるが国内または国外の一方に偏る、または限界の記述がなく本研究の位置が読み取りにくい
      2: 先行研究の列挙のみで、到達点・限界・本研究との関係が書かれていない
      1: 先行研究への言及がない
    evidence: 先行研究を挙げている段落と、本研究の位置を述べている文
    directions:
      - 先行研究を「到達点」と「限界」の2列で整理し、本研究が取り組む限界を明示する
      - 国外の動向が抜けていれば主要グループを2〜3件加える
      - 位置づけを図一枚で示せるなら図にする（モノクロで判読できること）
    questions:
      - この問いに世界で最も近いところにいるグループはどこか。彼らが解けていないのは何か
    transcript_check: 面談で挙がった競合グループ・関連研究が本文にあるか

  - id: R07
    name: 波及効果が具体的
    element: A1
    section: 欄1 (2)(3)
    source: 規程A(1)「より広い学術、科学技術あるいは社会などへの波及効果が期待できるか」
    levels:
      4: 自分野の外（隣接分野・技術・社会）への波及が、誰が・何に使えるかのレベルで具体的に書かれている
      3: 波及効果は書かれているが「〜への応用が期待される」のような一般的表現にとどまる
      2: 波及効果が自分野内の話にとどまる、または社会的意義の定型句のみ
      1: 波及効果の記述がない
    evidence: 波及効果を述べている文
    directions:
      - 波及先を一つ選び「誰が」「何に」使えるかを書く
      - 定型句（社会に貢献する、等）を具体的な波及先に置き換える
    questions:
      - この結果を一番使いたがるのは、自分の分野以外では誰か

  # ---------------------------------------------------------------- 欄1 (4) 何を・どのように・どこまで
  - id: R08
    name: 目的が研究項目に分解され、各項目に方法が対応している
    element: A2
    section: 欄1 (4)
    source: 規程A(2)「研究目的を達成するため、研究方法等は具体的かつ適切であるか」
    levels:
      4: 目的が2〜4個の研究項目に分解され、各項目について「対象・データ」「手法」「得られる結果」が書かれ、項目間の依存関係（順序）が分かる
      3: 研究項目はあるが、いずれかの項目で手法または得られる結果が書かれていない
      2: 方法が手法名の列挙（「〜法を用いる」）で、どの項目で何を得るかが不明
      1: 研究方法の記述がほとんどない
    evidence: 研究項目の見出しまたは列挙と、各項目の方法の記述
    directions:
      - 各研究項目を「対象・データ」「手法」「得られる結果」の3点で書き直す
      - 項目間の順序と依存関係を図（工程図）で示す
    questions:
      - 研究項目1の結果が出ないと項目2は始められないか。並行できるか
    transcript_check: 面談で語られた具体的な手順（サンプル数、装置、解析方法）が本文に反映されているか

  - id: R09
    name: 方法の妥当性が根拠付きで示されている
    element: A2
    section: 欄1 (4)
    source: 規程A(2)「研究方法等は具体的かつ適切であるか」
    levels:
      4: 主要な手法について「なぜその手法か」（代替手法との比較、または応募者の実績）と、規模（サンプル数・データ量・対象数）の根拠が書かれている
      3: 手法の選択理由はあるが規模の根拠がない、またはその逆
      2: 手法名と規模は書かれているが、選択理由も規模の根拠もない
      1: 手法が特定できない
    evidence: 手法の選択理由と規模を述べている文
    directions:
      - 主要手法について、他の手法でなくそれを選ぶ理由を一文加える
      - 規模（n、期間、対象数）とその根拠（検出力、先行研究の慣例、予備データ）を書く
    questions:
      - この規模で結論が出せる根拠は何か。足りなかった場合どうするか

  - id: R10
    name: 到達目標と年次計画が明確
    element: A2
    section: 欄1 (4)
    source: 様式(4)「本研究で何をどのように、どこまで明らかにしようとするのか」
    levels:
      4: 研究期間終了時の到達目標が検証可能な形で書かれ、年度ごとの実施内容と中間成果（マイルストーン）が対応している
      3: 到達目標はあるが年次計画が粗い（年度ごとの内容が「継続」「まとめ」程度）
      2: 年次計画はあるが到達目標が「〜を明らかにする」の繰り返しで、どこまでやれば達成かが分からない
      1: 到達目標も年次計画もない
    evidence: 到達目標の文と年次計画の記述（表があれば表）
    directions:
      - 最終年度末の「達成した状態」を一文で書き、逆算して各年度の中間成果を置く
      - 年次計画は表にし、研究項目との対応を明示する
    questions:
      - 最終年度が終わった時点で「成功した」と言える条件は何か

  - id: R11
    name: リスクと代替案が書かれている
    element: A2
    section: 欄1 (4)(5)
    source: 規程A(2)（方法の適切性・準備状況の一部として審査委員が見る点）
    levels:
      4: 計画の主要なリスク（データが得られない、手法が機能しない、協力が得られない等）が特定され、それぞれに代替案が書かれている
      3: リスクの言及はあるが代替案がない、または代替案が「適宜対応する」程度
      2: リスクへの言及がない（計画が順調に進む前提のみ）
      1: （2と同じ。この観点は2が下限）
    evidence: リスク・代替案に相当する文
    directions:
      - 最も起こりそうな失敗を一つ挙げ、その場合の代替手順を書く
    questions:
      - この計画で一番不安なのはどこか。そこが失敗したらどうするか
    transcript_check: 面談で研究者が「ここが心配」と語った点が本文で対策として書かれているか
    note: 規程の問いに直接の文言はないが、URAの経験上「方法の妥当性」の評価に効く観点として叩き台に含める。知見カードで裏付けを取る候補

  # ---------------------------------------------------------------- 欄1 (5) 準備状況
  - id: R12
    name: 準備状況が具体的な事実で示されている
    element: A2
    section: 欄1 (5)
    source: 規程A(2)「研究目的を達成するための準備状況は適切であるか」
    levels:
      4: 予備データ・予備実験の結果（数値や図）、既に確保した資料・装置・フィールド・協力者が具体的に挙げられ、計画の最初の研究項目が「すぐ始められる」ことが分かる
      3: 準備状況は書かれているが、予備データが「予備的検討を行った」の記述のみで結果が示されていない
      2: 準備状況が装置や環境の一般的記述のみで、本計画に直結する準備が示されていない
      1: 準備状況の記述がない
    evidence: 準備状況の段落、予備データの図表
    directions:
      - 予備データがあれば結果を数値か図で一つ示す
      - 「確保済み」「承諾済み」の事実を列挙する（協力機関、倫理審査の状況、データ利用許諾）
    questions:
      - 採択された翌月に最初にやることは何か。それは今すぐ始められる状態か
    transcript_check: 面談で語られた予備的な結果や既存資産が本文にあるか
    note: 開示情報で＊が付きやすい項目の一つ

  - id: R13
    name: 研究経費が計画と整合している
    element: A2
    section: 欄1 (4) × Web入力項目「研究経費とその必要性」
    source: 規程A(2)「研究経費は研究計画と整合性がとれたものとなっているか」/ 別添5 ⅱ 研究経費の妥当性
    levels:
      4: 主要な経費項目が研究項目・年次計画に対応付けられ、設備備品は計画遂行に必要な理由が書かれている
      3: 経費の必要性は書かれているが、どの研究項目・年度に対応するかが読み取れない項目がある
      2: 経費内訳と本文の計画に不一致がある（本文にない作業の経費、本文にある作業の経費がない）
      1: 経費の必要性の記述がない
    evidence: 本文の研究項目と、経費内訳の主要項目の対応
    directions:
      - 経費の各項目を研究項目と年度に紐づける
      - 設備備品費・旅費・人件費のいずれかが90%を超える場合は、有効に使われる理由を明記する（規程ⅱの確認項目）
    questions:
      - 経費の中で一番大きい項目は、本文のどの作業に使うか
    input_note: Web入力項目はWordの外にあるため、研究者に経費内訳のテキストを併せて提出してもらう

  - id: R14
    name: 研究分担者の役割が具体的
    element: A2
    section: 欄1 末尾
    source: 様式「研究代表者、研究分担者の具体的な役割を記述すること」
    levels:
      4: 分担者ごとに担当する研究項目と、その分担が必要な理由（専門性・資源）が書かれ、代表者との分担が明確
      3: 役割は書かれているが研究項目との対応が曖昧
      2: 分担者名と専門分野のみで役割の記述がない
      1: 分担者がいるのに役割の記述がない
    evidence: 役割分担の記述
    directions:
      - 分担者ごとに「研究項目X を担当、理由は〜」の形で書く
    applies_to: [kiban_b, kiban_c]
    condition: 研究分担者がいる場合のみ

  # ---------------------------------------------------------------- 欄2 研究遂行能力・研究環境
  - id: R15
    name: 研究活動の記述が本計画の実行可能性を示すよう選ばれている
    element: A3
    section: 欄2 (1)
    source: 規程A(3)「これまでの研究活動等から見て、研究計画に対する十分な遂行能力を有しているか」/ 記入要領「本研究計画に関連した研究活動を中心に」
    levels:
      4: 本計画の各研究項目に対応する過去の研究活動（手法の経験、対象の経験、関連成果）が明示的に対応付けられて書かれている
      3: 関連する研究活動は書かれているが、本計画のどの部分の実行可能性を示すかが読み手任せ
      2: 業績リストの羅列で、本計画との関連の説明がない
      1: 研究活動の記述がない
    evidence: 研究活動の記述と、本計画の研究項目との対応
    directions:
      - 研究項目ごとに「この項目の実行可能性を示す活動・成果」を一つずつ対応させる
      - 関連の薄い業績は削り、関連の強い業績に説明を付ける
    questions:
      - 本計画の中で、自分がまだやったことのない作業はどれか。それを補う経験や協力者は何か
    transcript_check: 面談で語られた「これは自分の得意なところ」が欄2に反映されているか
    note_wakate: 若手研究は研究歴が短い前提なので、業績数より「本計画に直結する経験」の対応付けを重視する。研究中断期間の説明は記入要領で認められている

  - id: R16
    name: 業績の記載が要領に沿っている
    element: A3
    section: 欄2 (1)
    source: 記入要領「同定するに十分な情報」「掲載済みまたは掲載確定のみ」「網羅的に記載するのではなく主要なもの」
    levels:
      4: 各業績に論文名・著者名・誌名・巻号頁・年が揃い、掲載済み/確定のみ、主要なものに絞られ、応募者の役割（筆頭・責任著者等）が分かる
      3: 書誌情報は揃っているが、投稿中・準備中が混在、または件数が多く主要なものが埋もれている
      2: 書誌情報が不完全（誌名や年がない）で同定できない業績がある
      1: 業績の記載がない
    evidence: 業績リスト
    directions:
      - 投稿中・準備中を削除する
      - 書誌情報の欠落を補う
      - 本計画に直結する業績を先頭に置き、件数を絞る
    check_type: 形式チェック（機械的に確認できる部分が多い）

  - id: R17
    name: 研究環境が本計画の遂行に足りることが示されている
    element: A3
    section: 欄2 (2)
    source: 規程A(3)「研究計画の遂行に必要な研究施設・設備・研究資料等、研究環境は整っているか」
    levels:
      4: 本計画の研究項目ごとに必要な施設・設備・資料・データ・協力体制が挙げられ、それぞれ「利用可能」であることの根拠（所属機関に設置、利用承諾済み等）がある
      3: 環境の記述はあるが、本計画で必要なもののうち一部について利用可能性の根拠がない
      2: 所属機関の一般的な環境説明のみで、本計画に必要なものとの対応がない
      1: 研究環境の記述がない
    evidence: 研究環境の段落
    directions:
      - 研究項目ごとに「必要なもの」と「確保状況」を対応させる
      - 外部資源（他機関の装置、データ提供）は承諾状況を書く
    questions:
      - 本計画で使うもののうち、まだ使える保証がないものはあるか

  # ---------------------------------------------------------------- 欄1 (6) 国際性（基盤B・Cのみ）
  - id: R18
    name: 国際性が3類型のいずれかで具体的に示されている
    element: B
    section: 欄1 (6)
    source: 規程B「国際性（将来的に世界の研究をけん引する、協同を通じて世界の研究の発展に貢献する、我が国独自の研究としての高い価値を創出する等）を発揮することが期待できるか」
    levels:
      4: 「けん引」「協同」「我が国独自」のどの類型で国際性を主張するかが明示され、その根拠（国際共同研究の実績や計画、国際的な研究動向の中での位置、日本固有の対象・資料の価値など）が具体的に書かれている
      3: 国際性の記述はあるが類型が曖昧、または根拠が「国際誌に発表する」「国際会議で報告する」など成果発信のみ
      2: 国際性の記述が一文の定型句のみ
      1: (6)の記述がない
    evidence: (6)に相当する段落
    directions:
      - 3類型から本研究に合うものを一つ選び、その根拠を書く
      - 成果発信（国際誌・国際会議）は根拠として弱いので、研究内容そのものの国際的位置づけに置き換える
      - 「我が国独自」型は、日本でしかできない理由（対象・資料・制度）を明示する
    questions:
      - この研究は海外の研究者から見て、どういう意味で「日本発の貢献」になるか
    transcript_check: 面談で語られた海外との関係（共同研究者、海外での研究歴、海外の競合）が(6)に反映されているか
    applies_to: [kiban_b, kiban_c]
    weight_note: 採否（総合評点）には直接効かない。配分額と「国際・若手支援強化枠」に効く。若手研究者が基盤B・Cに応募する場合は重みを上げる（form_structure.md「評定要素Bの扱い」）
    handbook_note: 審査の手引は「各分野で国際性の定義は異なるため、3類型に限らず審査区分の特性に応じて評価」と指示。3類型への当てはめは推奨であって必須ではない。分野の慣行に沿った国際性の示し方があればそれを優先する

  # ---------------------------------------------------------------- 横断
  - id: R19
    name: 選んだ小区分の審査委員に伝わる書き方になっている
    element: 横断（A1〜A3の読まれ方に影響）
    section: 全体 × Web入力項目「審査を希望する区分」
    source: 公募要領「審査委員は、応募者の研究計画が自身の専門分野に近いかどうかにはかかわらず…理解し、その意義を評価」/ 審査区分表の小区分「内容の例」
    levels:
      4: 選んだ小区分の「内容の例」の語彙と本文の主題が対応し、専門外の審査委員が読んでも問い・方法・意義が追える説明（専門用語の初出定義、図の活用）になっている
      3: 小区分との対応は取れているが、専門用語が未定義のまま多用され、隣接分野の審査委員には読みにくい
      2: 本文の主題が選んだ小区分の「内容の例」と離れており、別の小区分の方が適切に見える
      1: 小区分が未選択、または本文から主題が特定できない
    evidence: 小区分の「内容の例」と本文の主題語の対応、未定義の専門用語
    directions:
      - 主題が小区分と離れている場合は小区分の再検討を助言する（reference/shinsa/2027/shinsa_kubun.json を参照）
      - 専門用語は初出で一文の定義を付ける
    questions:
      - この小区分の審査委員は3名。その3名が全員自分の専門と違う場合、この申請書のどこで詰まるか
    data: reference/shinsa/2027/shinsa_kubun.json
    handbook_note: 審査の手引は「審査区分の選択が不適切でも、それだけを理由に評価を下げてはいけない」と指示。この観点は減点リスクではなく「専門外の委員3名に読まれる」リスクとして扱う。水準2の指摘は「別区分の方が適切かもしれない」という助言にとどめる

  - id: R20
    name: 分量配分と体裁が審査に適している
    element: 横断
    section: 全体
    source: 記入要領（頁数制限、11ポイント以上、モノクロ、項目タイトルが頁先頭、指示書きの削除）
    levels:
      4: 頁数制限内で、(1)〜(6)の分量が問い・方法・準備に厚く配分され、図表はモノクロで判読でき、見出しで構造が追える
      3: 制限内だが分量が背景に偏り、方法や準備が薄い
      2: 見出しがなく構造が追えない、または図がモノクロで判読できない
      1: 頁数超過、または様式の指示に反する（指示書き未削除、フォント）
    evidence: 各小項目のおおよその行数、図表の有無
    directions:
      - 背景の分量を減らし、(4)(5)に回す
      - 図は白黒印刷で判読できるか確認する（基盤A以外はグレースケール審査）
    check_type: 形式チェック（機械的に確認できる部分が多い）

  - id: R21
    name: 人権の保護及び法令等の遵守の記述漏れがない
    element: 対象外（総合評点に含めない。指摘があると開示に表示される）
    section: 欄3
    source: 別添5 ⅲ(2)、記入要領(3)「該当しない場合には、その旨を記述すること」
    levels:
      4: 該当する手続（倫理審査、同意取得、動物実験等）が特定され、承認状況または予定が書かれている。該当しない場合は「該当しない」と明記されている
      3: 該当するはずの手続（本文から読み取れる）の一部が書かれていない
      2: 欄が空欄、または「該当しない」の明記がない
      1: （2と同じ）
    evidence: 欄3の全文と、本文中で手続が必要と読み取れる作業
    directions:
      - 本文の方法から手続が必要な作業を拾い、対応する手続と状況を書く
      - 該当がなければ「該当しない」と書く
    check_type: 記述漏れチェックのみ（内容の評価は行わない）

# ---------------------------------------------------------------- 出力形式（レビューエンジンへの指示）
output_contract:
  per_observation:
    - quote: 本文からの引用（該当なしの場合は「該当箇所なし」）
    - level: 4/3/2/1
    - reason: なぜその水準か（levels の記述と対応させる）
    - direction: directions から該当するもの（修正文は書かない）
    - question: questions から研究者に返す問い（任意）
    - transcript_gap: 面談テキストがある場合のみ。面談で語られたが本文にないこと
  report_order:
    - 採否に効く観点（A1→A2→A3）で水準2以下のものを先に
    - 次に水準3のもの
    - 配分額・強化枠に効く観点（B）は別枠で
    - 形式チェック（R16, R20, R21）は末尾にまとめて
  reviewer_comment_simulation:
    - 審査の手引に従い、審査委員が書くであろう「審査意見」（200字程度、長所と短所を中心）を模擬生成して末尾に付ける。研究者が受け取る審査の像を示すため
    - 模擬審査意見は「審査委員の視点の例」と明記し、実際の審査意見が応募者に開示されないことも注記する
  retry_mode:
    - 開示情報で＊が付いた項目に対応する観点を最優先に置き、前年度版との差分がその観点に効いているかを判定する
    - 採択課題平均との差が大きい評定要素を「重点」として明示する
